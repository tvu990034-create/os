name: RouterOS full firmware build and boot test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-build-boot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Build x86_64 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out RouterOS
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk gettext git \
            default-jre-headless libncurses-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-yaml rsync subversion swig \
            xsltproc zlib1g-dev unzip

      - name: Setup OpenWrt build tree
        run: |
          ./setup.sh

      - name: Build x86_64 firmware
        working-directory: openwrt
        env:
          JOBS: 2
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config/x86_64.config .config
          make defconfig
          make download -j"$JOBS"
          make -j"$JOBS" V=s

      - name: Verify firmware output
        working-directory: openwrt
        run: |
          OUTPUT_DIR="bin/targets/x86/64"
          [ -d "$OUTPUT_DIR" ] || { echo "Output directory missing"; exit 1; }
          BIOS_IMAGE=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*generic-ext4-combined.img.gz' -print -quit)
          UEFI_IMAGE=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*generic-ext4-combined-efi.img.gz' -print -quit)
          ROOTFS_IMAGE=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*generic-ext4-rootfs.img.gz' -print -quit)
          [ -n "$BIOS_IMAGE" ] || { echo "BIOS combined ext4 image missing"; ls -lah "$OUTPUT_DIR"; exit 1; }
          [ -n "$UEFI_IMAGE" ] || { echo "UEFI combined ext4 image missing"; ls -lah "$OUTPUT_DIR"; exit 1; }
          [ -n "$ROOTFS_IMAGE" ] || { echo "Ext4 rootfs image missing"; ls -lah "$OUTPUT_DIR"; exit 1; }
          gzip -t "$BIOS_IMAGE"
          gzip -t "$UEFI_IMAGE"
          gzip -t "$ROOTFS_IMAGE"
          echo "Verified BIOS, UEFI and rootfs images:"
          printf 'BIOS: %s\nUEFI: %s\nRootfs: %s\n' "$BIOS_IMAGE" "$UEFI_IMAGE" "$ROOTFS_IMAGE"

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-x86_64-firmware
          path: openwrt/bin/targets/x86/64/
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-x86_64-build-logs
          path: openwrt/logs/
          retention-days: 7

  firmware-build-arm64:
    name: Build generic ARM64 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out RouterOS
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk gettext git \
            default-jre-headless libncurses-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-yaml rsync subversion swig \
            xsltproc zlib1g-dev unzip

      - name: Setup OpenWrt build tree
        run: ./setup.sh

      - name: Build generic ARM64 firmware
        working-directory: openwrt
        env:
          JOBS: 2
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config/armsr_armv8.config .config
          make defconfig
          grep -Fqx "CONFIG_TARGET_armsr=y" .config
          grep -Fqx "CONFIG_TARGET_armsr_armv8=y" .config
          make download -j"$JOBS"
          make -j"$JOBS" V=s

      - name: Verify ARM64 firmware output
        working-directory: openwrt
        run: |
          OUTPUT_DIR="bin/targets/armsr/armv8"
          [ -d "$OUTPUT_DIR" ] || { echo "ARM64 output directory missing"; exit 1; }
          [ -f "$OUTPUT_DIR/openwrt-25.12.6-armsr-armv8-generic-ext4-combined-efi.img.gz" ] || { echo "ARM64 EFI combined image missing"; exit 1; }
          [ -f "$OUTPUT_DIR/openwrt-25.12.6-armsr-armv8-generic-kernel.bin" ] || { echo "ARM64 kernel missing"; exit 1; }
          [ -f "$OUTPUT_DIR/openwrt-25.12.6-armsr-armv8-generic-ext4-rootfs.img.gz" ] || { echo "ARM64 ext4 rootfs missing"; exit 1; }
          echo "ARM64 firmware artifacts verified"

      - name: Upload ARM64 firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-armsr-armv8-firmware
          path: openwrt/bin/targets/armsr/armv8/
          retention-days: 7

      - name: Upload ARM64 build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-armsr-armv8-build-logs
          path: openwrt/logs/
          if-no-files-found: ignore
          retention-days: 7

  qemu-boot-test:
    name: QEMU boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: firmware-build

    steps:
      - name: Check out RouterOS
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: routeros-x86_64-firmware
          path: firmware/

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Decompress firmware image
        run: |
          BIOS_IMAGE=$(find firmware -maxdepth 1 -type f -name '*generic-ext4-combined.img.gz' -print -quit)
          [ -n "$BIOS_IMAGE" ] || { echo "BIOS image artifact not found"; ls -lah firmware/; exit 1; }
          gunzip -k "$BIOS_IMAGE"
          QEMU_DISK="${BIOS_IMAGE%.gz}"
          qemu-img info "$QEMU_DISK"
          printf 'QEMU BIOS disk image: %s\n' "$QEMU_DISK"
          echo "QEMU_DISK=$QEMU_DISK" >> "$GITHUB_ENV"

      - name: Boot in QEMU with basic service checks
        timeout-minutes: 5
        run: |
          SERIAL_LOG=/tmp/qemu-serial.log
          QEMU_PID=

          # Start QEMU in background with user networking (single interface limitation)
          # Note: CI environment does not support tap interfaces for WAN/LAN separation testing
          qemu-system-x86_64 \
            -nographic \
            -m 512M \
            -drive file="$QEMU_DISK",format=raw \
            -net nic,model=e1000 -net user \
            -serial file:"$SERIAL_LOG" &
          QEMU_PID=$!

          # Wait for boot with specific markers
          BOOT_TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $BOOT_TIMEOUT ]; do
            if grep -q "procd: - init complete" "$SERIAL_LOG" 2>/dev/null; then
              echo "Detected init system completion"
              break
            fi
            if grep -q "login:" "$SERIAL_LOG" 2>/dev/null; then
              echo "Detected login prompt"
              break
            fi
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "QEMU exited unexpectedly after ${ELAPSED}s"
              cat "$SERIAL_LOG"
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          # Check if QEMU is still running
          if ! kill -0 $QEMU_PID 2>/dev/null; then
            echo "QEMU exited before boot completion"
            cat "$SERIAL_LOG"
            exit 1
          fi

          # Check for critical boot components (serial log verification only)
          FAILED_CHECKS=0

          if ! grep -q "OpenWrt" "$SERIAL_LOG"; then
            echo "FAIL: OpenWrt not detected"
            FAILED_CHECKS=1
          fi

          if ! grep -q "procd:" "$SERIAL_LOG"; then
            echo "FAIL: procd init system not detected"
            FAILED_CHECKS=1
          fi

          if ! grep -q "netifd:" "$SERIAL_LOG"; then
            echo "FAIL: netifd network daemon not detected"
            FAILED_CHECKS=1
          fi

          if ! grep -q "firewall" "$SERIAL_LOG"; then
            echo "FAIL: firewall service not detected"
            FAILED_CHECKS=1
          fi

          if ! grep -q "dnsmasq" "$SERIAL_LOG"; then
            echo "FAIL: dnsmasq not detected"
            FAILED_CHECKS=1
          fi

          if ! grep -q "uhttpd" "$SERIAL_LOG"; then
            echo "FAIL: uhttpd web server not detected"
            FAILED_CHECKS=1
          fi

          if [ $FAILED_CHECKS -eq 0 ]; then
            echo "QEMU boot test: PASSED - All critical services detected"
            echo ""
            echo "NOTE: This test only verifies serial log output."
            echo "The following tests are NOT performed in CI:"
            echo "  - WAN/LAN interface separation (requires tap networking)"
            echo "  - DHCP assignment testing"
            echo "  - DNS resolution testing"
            echo "  - NAT and forwarding testing"
            echo "  - Firewall isolation testing"
            echo "  - Management interface availability testing"
            echo "  - Configuration persistence after reboot"
            echo "These require physical hardware or advanced QEMU networking configuration."
          else
            echo "QEMU boot test: FAILED - ${FAILED_CHECKS} service(s) missing"
            echo "Serial log:"
            cat "$SERIAL_LOG"
            exit 1
          fi

          # Clean shutdown
          kill $QEMU_PID
          wait $QEMU_PID || true

      - name: Upload QEMU serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: /tmp/qemu-serial.log
          if-no-files-found: ignore
          retention-days: 7
