name: Router OS Build and Test

on:
  pull_request:
    branches: [ main, phase-3-build-verification ]
  push:
    branches: [ phase-3-build-verification ]
  workflow_dispatch:

env:
  OPENWRT_COMMIT: ca454c0
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Router OS
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git default-jdk-headless jq libncurses5-dev libncursesw5-dev libssl-dev python3-distutils python3-setuptools python3-yaml rsync subversion swig xsltproc zlib1g-dev

    - name: Run Build Host Tests
      run: |
        ./test-build-host.sh

    - name: Fetch Required Sources
      run: |
        ./scripts/fetch-sources.sh --required-only

    - name: Verify Required Sources
      run: |
        ./scripts/verify-sources.sh --required-only

    - name: Setup Router OS
      run: |
        ./setup.sh
        mkdir -p openwrt/logs

    - name: Run Source Management Regression Tests
      run: |
        ./scripts/test-source-management.sh

    - name: Update Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update custom-feed
        ./scripts/feeds update packages
        ./scripts/feeds update luci
        ./scripts/feeds update routing

    - name: Install Custom Packages
      working-directory: openwrt
      run: |
        ./scripts/feeds install router-core
        ./scripts/feeds install router-net
        ./scripts/feeds install router-tests

    - name: Configure Build
      working-directory: openwrt
      run: |
        make defconfig
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        echo "CONFIG_PACKAGE_router-core=y" >> .config
        echo "CONFIG_PACKAGE_router-net=y" >> .config
        echo "CONFIG_PACKAGE_router-tests=y" >> .config
        echo "CONFIG_PACKAGE_kmod-e1000=y" >> .config
        echo "CONFIG_PACKAGE_kmod-igb=y" >> .config
        echo "CONFIG_PACKAGE_kmod-r8169=y" >> .config
        make oldconfig

    - name: Build Toolchain
      working-directory: openwrt
      run: |
        make toolchain/install -j$(nproc) V=s

    - name: Build Packages
      working-directory: openwrt
      run: |
        make package/feeds/custom-feed/router-core/compile -j$(nproc) V=s
        make package/feeds/custom-feed/router-net/compile -j$(nproc) V=s
        make package/feeds/custom-feed/router-tests/compile -j$(nproc) V=s

    - name: Build Image
      working-directory: openwrt
      run: |
        make -j$(nproc) V=s

    - name: Check Build Output
      working-directory: openwrt
      run: |
        echo "=== Checking for compiled packages ==="
        PACKAGE_DIR="bin/packages/x86_64"
        for package in router-core router-net router-tests; do
          PACKAGE_FILE="$(find "$PACKAGE_DIR" -type f -name "${package}_*.ipk" -print -quit)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: $package IPK was not produced"
            find "$PACKAGE_DIR" -maxdepth 3 -type f -name '*.ipk' -print || true
            exit 1
          fi
          echo "Found $PACKAGE_FILE"
        done
        echo "=== Checking for x86/64 images ==="
        TARGET_DIR="bin/targets/x86/64"
        test -d "$TARGET_DIR"
        find "$TARGET_DIR" -maxdepth 1 -type f -name '*.img.gz' -print -quit | grep -q .

    - name: Extract Image for QEMU
      working-directory: openwrt
      run: |
        TARGET_DIR="bin/targets/x86/64"
        IMAGE_GZ="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*combined-squashfs.img.gz' -print -quit)"
        if [ -z "$IMAGE_GZ" ]; then
          IMAGE_GZ="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
        fi
        test -n "$IMAGE_GZ"
        gunzip -k "$IMAGE_GZ"
        IMAGE="${IMAGE_GZ%.gz}"
        test -s "$IMAGE"
        echo "QEMU_IMAGE=$IMAGE" >> "$GITHUB_ENV"

    - name: QEMU Boot Test
      working-directory: openwrt
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86
        IMAGE="$QEMU_IMAGE"
        SERIAL_LOG="$PWD/logs/qemu-serial.log"
        QEMU_LOG="$PWD/logs/qemu-stderr.log"
        rm -f "$SERIAL_LOG" "$QEMU_LOG"

        echo "Starting QEMU with image: $IMAGE"
        qemu-system-x86_64 \
          -machine accel=tcg \
          -m 512M \
          -drive "file=$IMAGE,format=raw,if=ide" \
          -netdev user,id=net0 \
          -device e1000,netdev=net0 \
          -display none \
          -monitor none \
          -serial "file:$SERIAL_LOG" \
          -no-reboot >"$QEMU_LOG" 2>&1 &
        QEMU_PID=$!

        cleanup() {
          if kill -0 "$QEMU_PID" 2>/dev/null; then
            kill "$QEMU_PID" 2>/dev/null || true
            wait "$QEMU_PID" 2>/dev/null || true
          fi
        }
        trap cleanup EXIT

        BOOTED=0
        for attempt in $(seq 1 180); do
          if grep -Eq 'procd: - init complete -|init done|Please press Enter to activate this console\.' "$SERIAL_LOG" 2>/dev/null; then
            BOOTED=1
            break
          fi
          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "QEMU exited before the boot-completion marker appeared."
            break
          fi
          sleep 1
        done

        echo "=== Serial log (last 100 lines) ==="
        tail -100 "$SERIAL_LOG" 2>/dev/null || true
        echo "=== QEMU stderr (last 100 lines) ==="
        tail -100 "$QEMU_LOG" 2>/dev/null || true

        if [ "$BOOTED" -ne 1 ]; then
          echo "QEMU boot test FAILED: no boot-completion marker within 180 seconds."
          exit 1
        fi

        echo "QEMU boot test PASSED."
        cleanup
        trap - EXIT

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: openwrt/logs/
        if-no-files-found: warn
        retention-days: 7

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-images
        path: openwrt/bin/targets/x86/64/
        retention-days: 7

    - name: Upload Packages
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: custom-packages
        path: |
          openwrt/bin/packages/x86_64/**/router-core_*.ipk
          openwrt/bin/packages/x86_64/**/router-net_*.ipk
          openwrt/bin/packages/x86_64/**/router-tests_*.ipk
        retention-days: 7
