name: Router OS Build and Test

on:
  pull_request:
    branches: [ main, phase-3-build-verification ]
  push:
    branches: [ phase-3-build-verification ]
  workflow_dispatch:

env:
  OPENWRT_COMMIT: ca454c0
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Router OS
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-utils jq libncurses5-dev libncursesw5-dev libssl-dev python3-distutils python3-setuptools python3-yaml rsync subversion swig xsltproc zlib1g-dev

    - name: Run Build Host Tests
      run: |
        ./test-build-host.sh

    - name: Fetch Required Sources
      run: |
        ./scripts/fetch-sources.sh --required-only

    - name: Verify Required Sources
      run: |
        ./scripts/verify-sources.sh --required-only

    - name: Setup Router OS
      run: |
        ./setup.sh

    - name: Update Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update custom-feed
        ./scripts/feeds update packages
        ./scripts/feeds update luci
        ./scripts/feeds update routing

    - name: Install Custom Packages
      working-directory: openwrt
      run: |
        ./scripts/feeds install router-core
        ./scripts/feeds install router-net
        ./scripts/feeds install router-tests

    - name: Configure Build
      working-directory: openwrt
      run: |
        make defconfig
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        echo "CONFIG_PACKAGE_router-core=y" >> .config
        echo "CONFIG_PACKAGE_router-net=y" >> .config
        echo "CONFIG_PACKAGE_router-tests=y" >> .config
        echo "CONFIG_PACKAGE_kmod-e1000=y" >> .config
        echo "CONFIG_PACKAGE_kmod-igb=y" >> .config
        echo "CONFIG_PACKAGE_kmod-r8169=y" >> .config
        make oldconfig

    - name: Build Toolchain
      working-directory: openwrt
      run: |
        make toolchain -j$(nproc)

    - name: Build Packages
      working-directory: openwrt
      run: |
        make package/router-core/compile -j$(nproc) V=s
        make package/router-net/compile -j$(nproc) V=s
        make package/router-tests/compile -j$(nproc) V=s

    - name: Build Image
      working-directory: openwrt
      run: |
        make -j$(nproc) V=s

    - name: Check Build Output
      working-directory: openwrt
      run: |
        echo "=== Checking for compiled packages ==="
        ls -la bin/packages/x86_64/base/router-core_*.ipk 2>/dev/null || (echo "router-core package NOT found" && exit 1)
        ls -la bin/packages/x86_64/network/router-net_*.ipk 2>/dev/null || (echo "router-net package NOT found" && exit 1)
        ls -la bin/packages/x86_64/utils/router-tests_*.ipk 2>/dev/null || (echo "router-tests package NOT found" && exit 1)
        echo "=== Checking for images ==="
        ls -la bin/targets/x86_64/*.img.gz 2>/dev/null || (echo "Image NOT found" && exit 1)

    - name: Extract Image for QEMU
      working-directory: openwrt
      run: |
        IMAGE=$(ls bin/targets/x86_64/*.img.gz | head -1)
        gunzip -k "$IMAGE"
        ls -la bin/targets/x86_64/*.img

    - name: QEMU Boot Test
      working-directory: openwrt
      timeout-minutes: 10
      run: |
        sudo apt-get install -y qemu-system-x86
        IMAGE=$(ls bin/targets/x86_64/*.img | head -1)
        echo "Booting image: $IMAGE"
        
        timeout 300 qemu-system-x86_64 \
          -m 512M \
          -drive file="$IMAGE",format=raw \
          -net nic,model=e1000 \
          -net user \
          -nographic \
          -serial file:/tmp/qemu-serial.log || (echo "QEMU failed or timed out" && exit 1)
        
        echo "=== Serial Log (last 50 lines) ==="
        tail -50 /tmp/qemu-serial.log || true
        
        if grep -q "init done" /tmp/qemu-serial.log 2>/dev/null; then
            echo "✓ QEMU boot test PASSED"
        else
            echo "✗ QEMU boot test FAILED - init done not found"
            exit 1
        fi

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: openwrt/logs/
        retention-days: 7

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-images
        path: openwrt/bin/targets/x86_64/
        retention-days: 7

    - name: Upload Packages
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: custom-packages
        path: |
          openwrt/bin/packages/x86_64/base/router-core_*
          openwrt/bin/packages/x86_64/network/router-net_*
          openwrt/bin/packages/x86_64/utils/router-tests_*
        retention-days: 7
