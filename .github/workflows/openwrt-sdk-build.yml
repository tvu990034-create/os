name: OpenWrt 25.12.6 package SDK build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out RouterOS
        uses: actions/checkout@v4

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file curl zstd

      - name: Download pinned x86/64 SDK
        env:
          SDK_URL: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          SDK_SHA256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
        run: |
          curl -fsSL "$SDK_URL" -o openwrt-sdk.tar.zst
          echo "$SDK_SHA256  openwrt-sdk.tar.zst" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf openwrt-sdk.tar.zst -C sdk --strip-components=1

      - name: Register the RouterOS custom feed and select a minimal SDK profile
        working-directory: sdk
        env:
          CUSTOM_FEED: ${{ github.workspace }}/custom-feed
        run: |
          {
            echo "src-include defaults feeds.conf.default"
            echo "src-link routeros $CUSTOM_FEED"
          } > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install router-core
          ./scripts/feeds install router-net
          ./scripts/feeds install router-dsa-sdk
          ./scripts/feeds install router-dsa-runtime
          ./scripts/feeds install router-tests
          ./scripts/feeds install router-ui
          ./scripts/feeds install luci-base
          ./scripts/feeds install luci-mod-status

          # The SDK archive ships a broad release config. Replace it so package
          # validation only builds RouterOS packages and their true dependencies.
          cp "$GITHUB_WORKSPACE/config/sdk-package-build.config" .config
          make defconfig

      - name: Compile every custom package
        working-directory: sdk
        env:
          JOBS: 2
        run: |
          make -j"$JOBS" V=s \
            package/feeds/routeros/router-core/compile \
            package/feeds/routeros/router-net/compile \
            package/feeds/routeros/router-dsa-sdk/compile \
            package/feeds/routeros/router-dsa-runtime/compile \
            package/feeds/routeros/router-tests/compile \
            package/feeds/routeros/router-ui/compile

      - name: Upload custom package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-x86_64-ipk-packages
          path: sdk/bin/packages/x86_64/
          if-no-files-found: warn
          retention-days: 7
