name: OpenWrt 25.12.6 multi-platform package SDK build

on:
  push:
    branches: [foundation/ready-for-dsa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-build:
    name: SDK build (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: x86_64
            sdk_url: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
            config_file: config/sdk-package-build.config
          - profile: armsr_armv8
            sdk_url: https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/openwrt-sdk-25.12.6-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: cbf3343bc3d6dc6180fc84077b966c13596a79904adaadbfe68409d563b0b596
            config_file: config/sdk-package-build-armsr-armv8.config

    steps:
      - name: Check out RouterOS
        uses: actions/checkout@v4

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file curl zstd

      - name: Download and verify pinned OpenWrt SDK
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          curl -fsSL "$SDK_URL" -o openwrt-sdk.tar.zst
          echo "$SDK_SHA256  openwrt-sdk.tar.zst" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf openwrt-sdk.tar.zst -C sdk --strip-components=1

      - name: Register the RouterOS feed and select the matching SDK profile
        working-directory: sdk
        env:
          CUSTOM_FEED: ${{ github.workspace }}/custom-feed
          CONFIG_FILE: ${{ github.workspace }}/${{ matrix.config_file }}
        run: |
          {
            echo "src-include defaults feeds.conf.default"
            echo "src-link routeros $CUSTOM_FEED"
          } > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install router-core
          ./scripts/feeds install router-net
          ./scripts/feeds install router-tests
          ./scripts/feeds install router-firewall
          ./scripts/feeds install router-routing
          ./scripts/feeds install router-monitor
          ./scripts/feeds install router-device
          ./scripts/feeds install router-qos
          ./scripts/feeds install router-vpn
          ./scripts/feeds install router-dns
          ./scripts/feeds install router-dhcp
          ./scripts/feeds install router-api
          ./scripts/feeds install router-backup
          ./scripts/feeds install router-upgrade
          ./scripts/feeds install tcfilter
          ./scripts/feeds install wireguard-tools
          ./scripts/feeds install openvpn-openssl
          ./scripts/feeds install luci-base
          ./scripts/feeds install luci-mod-status
          ./scripts/feeds install luci-proto-wireguard
          ./scripts/feeds install luci-proto-openvpn

          cp "$CONFIG_FILE" .config
          DEVICE_TYPE=basic make defconfig

      - name: Compile core RouterOS packages
        working-directory: sdk
        env:
          JOBS: 2
        run: |
          DEVICE_TYPE=basic make -j"$JOBS" V=s \
            package/feeds/routeros/router-core/compile \
            package/feeds/routeros/router-net/compile \
            package/feeds/routeros/router-tests/compile \
            package/feeds/routeros/router-firewall/compile \
            package/feeds/routeros/router-routing/compile \
            package/feeds/routeros/router-monitor/compile \
            package/feeds/routeros/router-device/compile \
            package/feeds/routeros/router-qos/compile \
            package/feeds/routeros/router-vpn/compile \
            package/feeds/routeros/router-dns/compile \
            package/feeds/routeros/router-dhcp/compile \
            package/feeds/routeros/router-api/compile \
            package/feeds/routeros/router-backup/compile \
            package/feeds/routeros/router-upgrade/compile \
            package/feeds/packages/tcfilter/compile \
            package/feeds/packages/wireguard-tools/compile \
            package/feeds/packages/openvpn-openssl/compile \
            package/feeds/luci/luci-proto-wireguard/compile \
            package/feeds/luci/luci-proto-openvpn/compile

      - name: Compile DSA packages (optional, do not fail)
        working-directory: sdk
        env:
          JOBS: 2
        run: |
          DEVICE_TYPE=basic make -j"$JOBS" V=s \
            package/feeds/routeros/router-dsa-sdk/compile \
            package/feeds/routeros/router-dsa-runtime/compile || true

      - name: Upload custom package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-${{ matrix.profile }}-ipk-packages
          path: sdk/bin/packages/
          if-no-files-found: warn
          retention-days: 7
