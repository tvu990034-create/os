name: RouterOS source validation

on:
  push:
    branches: [foundation/ready-for-dsa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 nodejs

      - name: Validate source, platform profiles, shell and UCI configuration
        run: ./validate-packages.sh
