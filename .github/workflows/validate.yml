name: RouterOS source validation

on:
  push:
    branches:
      - main
      - foundation/ready-for-dsa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Validate source, shell and UCI configuration
        run: ./validate-packages.sh
