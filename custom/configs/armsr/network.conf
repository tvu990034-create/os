# ARM Generic Network Configuration Template
# ARM-SR (generic ARM) systems
# Modify device names to match your specific hardware

config interface 'loopback'
	option device 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config globals 'globals'
	option ula_prefix 'fd12:3456:789a::/48'

# ARM systems may use eth0, eth1, end0, end1, or other naming
# Use 'ip link show' to determine actual device names

config device
	option name 'br-lan'
	type 'bridge'
	# Add LAN ports based on your hardware
	# list ports 'eth1'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	option ipaddr '192.168.1.1'
	option netmask '255.255.255.0'
	option ip6assign '60'

config interface 'wan'
	# Modify device to match your WAN interface
	option device 'eth0'
	option proto 'dhcp'

config interface 'wan6'
	option device 'eth0'
	option proto 'dhcpv6'
