# Generic Network Configuration Template
# This is a template for configuring network interfaces on generic hardware
# Copy this to /etc/config/network and modify for your specific hardware

config interface 'loopback'
	option device 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config globals 'globals'
	option ula_prefix 'fd12:3456:789a::/48'

# Note: Modify the device names below to match your hardware
# Common names: eth0, eth1, enp1s0, enp2s0, etc.

config device
	option name 'br-lan'
	type 'bridge'
	# Add LAN ports here
	# list ports 'eth1'
	# list ports 'eth2'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	option ipaddr '192.168.1.1'
	option netmask '255.255.255.0'
	option ip6assign '60'

config interface 'wan'
	# Modify device to match your WAN interface
	option device 'eth0'
	option proto 'dhcp'

config interface 'wan6'
	# Modify device to match your WAN interface
	option device 'eth0'
	option proto 'dhcpv6'
