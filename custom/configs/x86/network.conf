# x86 Network Configuration Template
# Typical x86 systems with multiple Ethernet ports
# Modify device names to match your specific hardware

config interface 'loopback'
	option device 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config globals 'globals'
	option ula_prefix 'fd12:3456:789a::/48'

# Common x86 Ethernet naming: eth0, eth1, eth2, enp1s0, enp2s0, etc.
# Use 'ip link show' to determine actual device names

config device
	option name 'br-lan'
	type 'bridge'
	# Add LAN ports - typically eth1, eth2, etc.
	list ports 'eth1'
	list ports 'eth2'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	option ipaddr '192.168.1.1'
	option netmask '255.255.255.0'
	option ip6assign '60'

config interface 'wan'
	# Typically eth0 or the first port
	option device 'eth0'
	option proto 'dhcp'

config interface 'wan6'
	option device 'eth0'
	option proto 'dhcpv6'
