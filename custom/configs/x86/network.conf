# x86_64 RouterOS network template.
# The first detected wired NIC becomes LAN; the second becomes WAN.
# Additional detected wired NICs are added to the LAN bridge.

config interface 'loopback'
	option device 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config globals 'globals'

config device 'lan_bridge'
	option name 'br-lan'
	option type 'bridge'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	option ipaddr '192.168.1.1'
	option netmask '255.255.255.0'
	option ip6assign '60'
