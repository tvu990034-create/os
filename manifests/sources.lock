# Router OS Source Manifest
# This file records all upstream source repositories and their pinned revisions
# This allows reproducible builds across different environments
#
# Format: INI-style sections
# type = required | reference
# required repositories are needed for the build
# reference repositories are optional and for future reference

[openwrt]
name = OpenWrt
url = https://github.com/openwrt/openwrt.git
commit = ca454c00b69fc684e1c5ea52f62733c4e644e799
branch = master
type = required
purpose = Core OpenWrt build system and source tree
integration = Primary build system, cloned to openwrt/
managed_by = Router OS (pinned)
notes = Manages its own Linux kernel (6.18.55) via target/linux/generic/kernel-6.18
ignore_changes = custom/, feeds.conf.local

[packages]
name = OpenWrt Packages Feed
url = https://github.com/openwrt/packages.git
commit = 6307bdf3b7997a4de5317e127383b4266fe36108
branch = master
type = required
purpose = OpenWrt package feed for standard packages
integration = Managed by OpenWrt feeds system (src-git packages)
managed_by = OpenWrt (feeds)
notes = Can be fetched locally or remotely. If local, use pinned commit.

[luci]
name = LuCI Web Interface
url = https://github.com/openwrt/luci.git
commit = 0e2783557642331eb0afdc92d02c1d624f44fef7
branch = master
type = required
purpose = OpenWrt web interface
integration = Managed by OpenWrt feeds system (src-git luci)
managed_by = OpenWrt (feeds)
notes = Can be fetched locally or remotely. If local, use pinned commit.

[routing]
name = OpenWrt Routing Feed
url = https://github.com/openwrt/routing.git
commit = 4b9891b9136259f93294a424507ed24c5e8c1cbd
branch = master
type = required
purpose = OpenWrt routing packages (bird, quagga, etc.)
integration = Managed by OpenWrt feeds system (src-git routing)
managed_by = OpenWrt (feeds)
notes = Can be fetched locally or remotely. If local, use pinned commit.

[linux]
name = Linux Kernel (Reference)
url = https://github.com/torvalds/linux.git
commit = c339f4010dea8b0d754f84ace70cd1b089878ef8
branch = master
type = reference
purpose = Reference for upstream Linux kernel (not used in build)
integration = Not integrated into build (OpenWrt manages its own kernel)
managed_by = Router OS (reference only)
notes = NOT REQUIRED for OpenWrt build. OpenWrt uses kernel 6.18.55 via its own mechanism. This is the upstream torvalds/linux.git tree for reference only.
ignore_changes = *

